<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RealSense Camera Test</title>
    <link rel="stylesheet" href="/camera-test.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>RealSense Camera Test</h1>
        <div class="actions">
          <select id="cameraSelect" aria-label="Camera device" hidden></select>
          <button id="browserButton" type="button" hidden>Browser camera</button>
          <button id="releaseButton" type="button" hidden>Release camera</button>
          <button id="backendLiveButton" type="button">Camera: RealSense</button>
          <button id="backendButton" class="primary-action" type="button">Capture</button>
          <button id="streamStatusButton" type="button" hidden>Stream status</button>
          <button id="refreshButton" type="button" hidden>Refresh status</button>
        </div>
      </header>

      <section class="viewer">
        <div class="video-cell">
          <video id="browserVideo" autoplay muted playsinline></video>
          <canvas id="analysisCanvas" hidden></canvas>
        </div>
        <img id="backendImage" alt="RealSense backend frame" />
      </section>

      <section class="status">
        <div class="status-grid">
          <div>
            <span>Browser camera</span>
            <strong id="browserStatus">Checking browser devices...</strong>
          </div>
          <div>
            <span>RealSense SDK</span>
            <strong id="sdkStatus">Checking SDK...</strong>
          </div>
          <div>
            <span>Backend frame</span>
            <strong id="backendStatus">Idle</strong>
          </div>
        </div>
        <pre id="details"></pre>
      </section>
    </main>

    <script type="module" src="/camera-test.js?v=pyrealsense_mjpeg_debug"></script>
  </body>
</html>
